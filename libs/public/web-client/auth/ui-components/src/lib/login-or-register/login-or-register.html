<div class="login-or-register">
  <div class="login-or-register__login">
    <p>Already have an account?</p>

    <shared-auth-login-button />
  </div>

  <div class="login-or-register__register">
    <p>Or</p>

    <!-- FIXME: implement login button style directive (in shared/auth/ui-components) so we can keep [bg] and [width] of "Create an Account" button the same as "Sign In" button -->
    <shared-base-button
      [label]="{ content: 'Create an Account' }"
      [link]="{ url: registerFrontendUrl(), type: 'routerLink' }"
      [bg]="'accent'"
      [width]="'full'"
    />
  </div>
</div>
