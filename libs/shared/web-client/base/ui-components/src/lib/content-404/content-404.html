<div class="content-404">
  <h1 class="content-404__title">
    Ops...
  </h1>

  <p class="content-404__sub-title">
    We can't find this page :(
  </p>

  @if (buttonData(); as buttonData) {
    <shared-base-button
      [link]="{url: buttonData.url}"
      [background]="'accent'"
      [width]="'fitContent'"
    >
      {{buttonData.label}}
    </shared-base-button>
  }
</div>
