<ng-template #buttonContent>
  @if (icon(); as _icon) {
    <shared-base-icon [name]="_icon.name" />
  }

  <span>
    <ng-content />
  </span>
</ng-template>

@if (link(); as link) {
  <!-- TODO: set "--is-overlay-active" -->
  <a
    [class]="cssClasses()"
    [routerLink]="link.url"
    [routerLinkActive]="link.isRouterLinkActiveSync ? '--active' : ''"
  >
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </a>
}
@else {
  <button type="button" [class]="cssClasses()">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>
}
