<ng-template #buttonContent>
  @if (icon(); as icon) {
  <fa-icon [icon]="icon.definition" [ariaHidden]="true" />
  }

  <span>
    <ng-content />
  </span>
</ng-template>

@if (link(); as link) {
<a
  [class]="cssClasses()"
  [routerLink]="link.url"
  [routerLinkActive]="link.isRouterLinkActiveSync ? '--is-overlay-active' : ''"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</a>
} @else {
<button type="button" [class]="cssClasses()">
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
}
