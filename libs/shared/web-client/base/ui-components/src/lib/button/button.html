<!-- TODO: make it button if link is not provided -->
<a
  [class]="[
    'button',
    `--bg-${background()}`,
    `--has-overlay-before`,
    `--width-${width()}`,
    `--content-align-${contentAlign()}`,
    (icon() ? `--icon-position-${icon()?.position}` : ''),
    `--g-${icon()?.position === 'top' ? 'xs' : 'md'}-responsive`,
    `--my-${marginY()}-responsive`,
    `--px-${paddingXFinal()}-responsive`,
    `--py-${paddingYFinal()}-responsive`,
    `--text-size-${fontSizeFinal()}-responsive`,
  ]"
  [routerLink]="link()?.url"
  [routerLinkActive]="link()?.isRouterLinkActiveSync ? '--active' : ''"
>
  @if (icon(); as _icon) {
  <shared-base-icon [name]="_icon.name" />
  }

  <span>
    <ng-content />
  </span>
</a>
