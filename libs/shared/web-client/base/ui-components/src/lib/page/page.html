<div class="page --bg-base" [class.--minimalistic]="isMinimalistic()">
  <shared-base-header class="page__header">
    <ng-content select="header-actions" ngProjectAs="actions" />
  </shared-base-header>

  @if (isSidebarVisible()) {
    <shared-base-sidebar class="page__sidebar" />
  }

  <main class="page__content --px-md-responsive --py-xl-responsive">
    <!-- TODO: remove this div after base components development is done -->
    <div>
      <div class="--bg-base">
        <p>Common text.</p>

        <p class="--text-accent">Common text.</p>

        <shared-base-button>
          button transparent
        </shared-base-button>
      </div>

      <div class="--bg-accent">
        <p>Common text.</p>

        <p class="--text-accent">Common text.</p>

        <shared-base-button>
          button transparent
        </shared-base-button>
      </div>
    </div>

    <ng-content select="main-content" />
  </main>

  @if (isFooterVisible()) {
  <shared-base-footer class="page__footer" />
  }
</div>
