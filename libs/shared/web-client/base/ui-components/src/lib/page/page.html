<div class="page --text-size-md-responsive --bg-base" [class.--minimalistic]="isMinimalistic()">
  @if (isHeaderVisible()) {
    <shared-base-header class="page__header">
      <ng-content select="header-actions" ngProjectAs="actions" />
    </shared-base-header>
  }

  @if (isSidebarVisible()) {
    <shared-base-sidebar class="page__sidebar" />
  }

  <main class="page__main-content --px-md-responsive --py-xl-responsive">
    <div class="page__main-content__inner">
      <!-- TODO: remove this div after base components development is done -->
      <div>
        <div class="--bg-base">
          <p>Common text.</p>

          <p class="--text-accent">Common text.</p>

          <shared-base-button>
            button transparent
          </shared-base-button>
        </div>

        <div class="--bg-accent">
          <p>Common text.</p>

          <p class="--text-accent">Common text.</p>

          <shared-base-button>
            button transparent
          </shared-base-button>
        </div>
      </div>

      <ng-content select="main-content" />
    </div>
  </main>

  @if (isFooterVisible()) {
    <shared-base-footer class="page__footer" />
  }
</div>
