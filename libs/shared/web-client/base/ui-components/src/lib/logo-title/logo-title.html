<a routerLink="/" class="logo-title --g-sm-responsive --text-size-2xl-responsive --border-radius">
  <div class="logo-title__logo-wrapper">
    <img [ngSrc]="content.logoSrc" fill priority alt="Logo" />
  </div>

  <div class="logo-title__text">
    <span class="logo-title__text__line-1"> {{ content.text.line1 }} </span>

    <span class="logo-title__text__line-2"> {{ content.text.line2 }} </span>
  </div>
</a>
