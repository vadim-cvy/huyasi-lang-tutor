<nav class="nav --orientation-{{orientation()}}">
  <ul class="nav__list">
    @for (navItem of navItems; track navItem.route) {
    <li>
      <web-public-base-components-button
        [link]="{ url: navItem.route, isRouterLinkActiveSync: true }"
        [icon]="{ position: buttonsIconsPosition(), name: navItem.iconName }"
        [width]="'full'"
        [contentAlign]="buttonsContentAlign()"
        [paddingX]="buttonsPaddingX()"
      >
        {{navItem.label}}
      </web-public-base-components-button>
    </li>
    }
  </ul>
</nav>
