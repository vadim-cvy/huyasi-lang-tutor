<nav class="nav --orientation-{{orientation()}}">
  <ul class="nav__list">
    @for (navItem of navItems; track navItem.route) {
      <li class="nav__list__item">
        <a
          [routerLink]="navItem.route"
          routerLinkActive="--active"
          class="nav__list__item__link"
        >
          <!-- TODO: set real icons -->
          <span>icon: {{navItem.icon}}</span>

          @if (areLabelsVisible()) {
            <span>{{navItem.label}}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
