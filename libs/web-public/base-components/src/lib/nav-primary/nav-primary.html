<nav>
  <ul>
    @for (navItem of navItems; track navItem.route) {
      <li>
        <a [routerLink]="navItem.route" routerLinkActive="active">
          <!-- TODO: set real icons -->
          <span>icon: {{navItem.icon}}</span>

          @if (areLabelsVisible()) {
            <span>{{navItem.label}}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
