<div class="page --bg-base" [class.--minimalistic]="isMinimalistic()">
  <web-public-base-components-header class="page__header">
    <ng-content select="header-actions" ngProjectAs="actions" />
  </web-public-base-components-header>

  @if (isSidebarBreakpointMatch() && !isMinimalistic()) {
    <web-public-base-components-sidebar class="page__sidebar" />
  }

  <main class="page__content">
    <!-- TODO: remove this div after base components development is done -->
    <div>
      <div class="--bg-base">
        <p>Common text.</p>

        <p class="--text-accent">Common text.</p>

        <web-public-base-components-button>
          button transparent
        </web-public-base-components-button>
      </div>

      <div class="--bg-accent">
        <p>Common text.</p>

        <p class="--text-accent">Common text.</p>

        <web-public-base-components-button>
          button transparent
        </web-public-base-components-button>
      </div>
    </div>

    <ng-content select="main-content" />
  </main>

  @if (isFooterBreakpointMatch() && !isMinimalistic()) {
    <web-public-base-components-footer class="page__footer" />
  }
</div>
