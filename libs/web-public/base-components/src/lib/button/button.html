<button
  [class]="[
    'button',
    `--style-${style()}`,
    `--width-${width()}`,
    `--size-${size()}`,
    `--content-align-${contentAlign()}`,
    (icon() ? `--icon-position-${icon()?.position}` : '')
  ]"
  [routerLink]="link()?.url"
  [routerLinkActive]="link()?.isRouterLinkActiveSync ? '--active' : ''"
>
  @if (icon(); as _icon) {
    <web-public-base-components-icon [name]="_icon.name" />
  }

  <span>
    <ng-content />
  </span>
</button>
