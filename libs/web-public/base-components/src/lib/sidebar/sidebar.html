<div class="sidebar">
  <web-public-base-components-nav-primary
    [isMinimalistic]="!isSidebarExpanded"
    orientation="vertical"
  />

  <web-public-base-components-button
    [style]="'transparent'"
    [icon]="
      isSidebarExpanded
      ? { position: 'left', name: 'arrow-left' }
      : { position: 'top', name: 'arrow-right' }
    "
    (click)="isSidebarExpanded = !isSidebarExpanded"
  >
    {{ isSidebarExpanded ? 'Collapse' : 'Expand' }}
  </web-public-base-components-button>
</div>
