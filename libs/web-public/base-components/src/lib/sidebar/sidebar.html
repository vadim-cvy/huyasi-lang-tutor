<div class="sidebar">
  <web-public-base-components-nav-primary
    [isMinimalistic]="!isExpanded"
    orientation="vertical"
  />

  <web-public-base-components-button
    [style]="'transparent'"
    [icon]="
      isExpanded
      ? { position: 'left', name: 'arrow-left' }
      : { position: 'top', name: 'arrow-right' }
    "
    (click)="isExpanded = !isExpanded"
  >
    {{ isExpanded ? 'Collapse' : 'Expand' }}
  </web-public-base-components-button>
</div>
