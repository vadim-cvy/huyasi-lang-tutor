<div class="sidebar">
  <web-public-base-components-nav-primary
    [buttonsIconsPosition]="buttonsIconsPosition()"
    [buttonsContentAlign]="buttonsContentAlign()"
    [buttonsSize]="buttonsSize()"
    [orientation]="'vertical'"
  />

  <web-public-base-components-button
    [style]="'transparent'"
    [icon]="{
      position: buttonsIconsPosition(),
      name: isExpanded() ? 'arrow-left' : 'arrow-right'
    }"
    [width]="'full'"
    [size]="buttonsSize()"
    [contentAlign]="buttonsContentAlign()"
    (click)="isExpanded.set(!isExpanded())"
  >
    {{ isExpanded() ? 'Collapse' : 'Expand' }}
  </web-public-base-components-button>
</div>
